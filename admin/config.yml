backend:
  name: github
  repo: ItsRadioo/apple-day-site
  branch: main

media_folder: "uploads"
public_folder: "/uploads"

collections:
  - name: "appleday"
    label: "Apple Day Info"
    file: "content/appleday.json"
    format: "json"
    fields:
      - { label: "Locations", name: "locations", widget: "list" }
      - { label: "Apple Types", name: "apples", widget: "list" }
      - { label: "Suppliers", name: "suppliers", widget: "list" }
